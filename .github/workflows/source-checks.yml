name: Source and publication checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify scanner and scan Git history
        shell: bash
        run: |
          set -euo pipefail
          name=gitleaks_8.30.1_linux_x64.tar.gz
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 "$base/$name" -o "$name"
          curl --fail --location --retry 2 "$base/gitleaks_8.30.1_checksums.txt" -o checksums.txt
          grep "  $name$" checksums.txt | sha256sum --check
          tar -xzf "$name" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git . --redact=100 --no-banner
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node tools/check-publication.mjs
      - run: npm ci
        working-directory: apps/ene-desktop
      - run: npm run build
        working-directory: apps/ene-desktop
      - run: node --test tests/pet-hit-test.test.mjs
        working-directory: apps/ene-desktop
